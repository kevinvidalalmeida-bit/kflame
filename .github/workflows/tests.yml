name: KFLAME regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kflame-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[reference,test]"
      - run: python -m compileall -q src tests benchmarks tools examples
      - run: python -m unittest discover -s tests -v

  native-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/tests/no_cantera
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install built distribution, not editable source
        run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - name: Smoke test installed CLI outside repository root
        working-directory: ${{ runner.temp }}
        run: >-
          python -m kflame fgm --phi-values 1 --disable-seed-cache
          --parallel-workers 1 --max-flame-time-s 180
          --output-root native-ci --save-raw-profiles
