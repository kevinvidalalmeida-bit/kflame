name: Solver regression tests

on:
  pull_request:
  push:
    branches:
      - main
      - "publication/**"

permissions:
  contents: read

concurrency:
  group: solver-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile modified modules
        run: |
          python -m py_compile \
            V2/equations.py \
            V2/solver.py \
            V2/run_saved_comparison.py \
            FGM/scripts/fgm_common.py \
            FGM/scripts/generate_fgm_tables_native.py \
            FGM/scripts/generate_fgm_tables_cantera.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
